# LiteLLM 网关配置（变化轴 3：生成模型供应商——该轴的 adapter 层就是本网关，规范 §5.2）。
# 纪律：业务代码只引用任务级逻辑模型名（{任务}.{variant}）；逻辑名→物理 model_id 的映射只在本文件。
# 换模型 = 改本文件，不改代码。物理凭证经环境变量注入（~/.ishome/llm-local.env，不入库）。
# TODO(langfuse)：Langfuse 逐会话成本追踪接入（自托管部署后在此加 success_callback）。
model_list:
  - model_name: design-orchestrator.default   # 设计会话主编排（质量优先）
    litellm_params:
      model: openai/qwen-plus
      api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: os.environ/DASHSCOPE_API_KEY
  - model_name: design-intent.default          # 意图路由/输入归一化（低延迟低成本）
    litellm_params:
      model: openai/qwen-flash
      api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: os.environ/DASHSCOPE_API_KEY
  # 叙事推导（图 v0.2 §3 单元子图第一步）：只定"这一域讲哪几件事"，内部语域、看不见落点的值。
  # 与写作分两个逻辑名而不是复用一个（变化轴 3：{任务}.{variant}）——两步是两个任务，
  # 换其中一个的模型不该牵动另一个；两步塌成一步的代价实测过（落点清单成了唯一结构化输入，
  # 23 条落点写成 23 张"念数字"的卡，2026-08-29 真跑）。
  - model_name: report-unit-derive.default     # 报告成文线·叙事推导（reportgen，只定讲什么）
    litellm_params:
      model: openai/qwen-plus
      api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: os.environ/DASHSCOPE_API_KEY
  - model_name: report-unit-compose.default    # 报告成文线·单元成文（reportgen，卡片写作，质量优先）
    litellm_params:
      model: openai/qwen-plus
      api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: os.environ/DASHSCOPE_API_KEY
  # 判官层（图 v0.2 §3 出口过检第二道）：读规则层放过的卡片，按 release 里的 cr-+反例样例只报编号。
  # 与写作同底模是已知风险（判官与写手同源必漂，规则 4.17）——防漂移不靠换模型，靠三道入册门禁
  # （种子集回归 / 观察态 / 每轮上限）。换判官模型 = 只改这一行，不动代码。
  - model_name: report-unit-judge.default      # 报告成文线·单元判官（reportgen，只判不写）
    litellm_params:
      model: openai/qwen-plus
      api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: os.environ/DASHSCOPE_API_KEY

  # 户型图解析（获客线第一步"特征能被推出来"）：视觉模型直读户型图 → 户型特征标记 + 依据。
  # 视觉任务与文本任务分逻辑名（变化轴 3：{任务}.{variant}）——换视觉模型不牵动会话与报告两线。
  # 纪律：本任务只出标记与依据，**一个数字都不出**（尺寸/面积/比例由确定性代码在标定链路算，
  # 红线"数字不由 LLM 决定"）；产出的标记键由解析侧按 contracts `rulebook/layout_features.json`
  # 闭集校验，越界响亮失败。
  - model_name: floorplan-parse.default         # 户型图解析·特征标记（genpipe-worker，视觉直读）
    litellm_params:
      model: openai/qwen3-vl-plus
      api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: os.environ/DASHSCOPE_API_KEY

  - model_name: floorplan-notes.default          # 户型批注：拿算好的事实去推理（不读图）
    litellm_params:
      model: openai/qwen-plus
      api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: os.environ/DASHSCOPE_API_KEY

  # 图像生成（火山引擎方舟 / 即梦 Seedream；2026-08-23 开通并实测：文生图与图生图均通，
  # 图生图保构图——atmosphere-visual 要求母版几何不变、realism-pass 要求底渲结构不变，故适配）。
  # drop_params 单模型关掉：图生图的 image / watermark / size:"2K" 非 OpenAI 标准参数，丢了就退化成文生图。
  - model_name: atmosphere-visual.default       # 风格化交付图（母版+模板声明 → 交付图）
    litellm_params:
      model: openai/doubao-seedream-5-0-pro-260628
      api_base: https://ark.cn-beijing.volces.com/api/v3
      api_key: os.environ/ARK_API_KEY
      drop_params: false
    model_info:
      mode: image_generation
  - model_name: realism-pass.default            # 生成式写实化（三维底渲 → 写实图）
    litellm_params:
      model: openai/doubao-seedream-5-0-pro-260628
      api_base: https://ark.cn-beijing.volces.com/api/v3
      api_key: os.environ/ARK_API_KEY
      drop_params: false
    model_info:
      mode: image_generation

litellm_settings:
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
